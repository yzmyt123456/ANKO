<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b7cf0"/>
      <stop offset="100%" stop-color="#5744cf"/>
    </linearGradient>
  </defs>
  <!-- 骰子主体:紫色渐变圆角方块(呼应平台主题色) -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bg)"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="#3d31a8" stroke-opacity="0.45"/>
  <!-- 高光 -->
  <ellipse cx="20" cy="14" rx="16" ry="7" fill="#ffffff" opacity="0.12"/>
  <!-- 骰子点:对角 3 点 -->
  <circle cx="21" cy="21" r="6.5" fill="#ffffff"/>
  <circle cx="32" cy="32" r="6.5" fill="#ffffff" opacity="0.92"/>
  <circle cx="43" cy="43" r="6.5" fill="#ffffff" opacity="0.82"/>
</svg>
